<style>
  :root {
    --bg: #f4ead4;
    --green: #0f4f2e;
    --brand-green: #0d4f2e;
    --sun: #fdc010;
    --red: #d2202a;
    --cream: #f4ead4;
    --font-display: "Archivo", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1); /* easeOutQuint (pocket-design get_easing) */
    --spring: linear(0, 0.0138, 0.0508, 0.1052, 0.1718, 0.2462, 0.3248, 0.4046, 0.4833, 0.559, 0.6303, 0.6963, 0.7563, 0.81, 0.8574, 0.8985, 0.9336, 0.963, 0.9871, 1.0064, 1.0215, 1.0328, 1.0408, 1.046, 1.0489, 1.0499, 1.0494, 1.0476, 1.045, 1.0417, 1.038, 1.0341, 1.0302, 1.0262, 1.0224, 1.0188, 1.0155, 1.0125, 1.0098, 1.0074, 1.0053, 1.0035, 1.002, 1.0008, 0.9998, 0.999, 0.9984, 0.998, 0.9977, 0.9976, 0.9975, 0.9975, 0.9976, 0.9977, 0.9979, 0.9981, 0.9983, 0.9985, 0.9987, 0.9989, 1); /* mola 170/18 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--green);
    font-family: var(--font-body); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 8px; }

  /* Tela inteira: personagem no centro */
  .stage {
    position: fixed; inset: 0;
    /* personagem: altura limitada pela tela, descontando a barra de abas */
    --fig-h: clamp(220px, 42dvh, 360px);   /* pequena, como uma boneca */
    --fig-top: calc((100dvh - 80px) / 2);
  }
  .glow {
    position: absolute; left: 50%; top: var(--fig-top); width: calc(var(--fig-h) * 1.15); aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(253, 192, 16, .42) 0%, rgba(253, 192, 16, .14) 38%, rgba(253, 192, 16, 0) 68%);
  }
  /* personagens no centro, como bonecos (vídeos sem fundo), um de cada vez */
  .figure {
    /* --gap: espaço entre os pés e a base do vídeo; --zoom: aumenta quem foi filmado de mais longe.
       O topo é ajustado para os pés de todos ficarem na mesma linha de chão. */
    position: absolute; left: 50%; height: calc(var(--fig-h) * var(--zoom, 1)); aspect-ratio: var(--ar, 390 / 960);
    top: calc(var(--fig-top) + var(--fig-h) * (.47 - var(--zoom, 1) * (.5 - var(--gap, .03))));
    transform: translate(-50%, -44%) scale(.9); opacity: 0; pointer-events: none;
    transition: opacity .45s var(--ease), transform .45s var(--ease);
  }
  /* um personagem por vez: o ativo entra com mola, o outro sai encolhendo */
  .figure.is-on {
    opacity: 1; transform: translate(-50%, -50%) scale(1);
    transition: opacity .5s var(--ease) .15s, transform 1s var(--spring) .15s;
  }
  .figure canvas, .figure img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .figure img { object-fit: contain; }
  .figure.playing img { opacity: 0; }
  /* o vídeo fica na página (não "escondido"), mas minúsculo e invisível: o Chrome do Android
     pausa vídeos com display:none ou fora da tela, e aí a animação não aparecia */
  .figure video { position: absolute; left: 0; bottom: 0; width: 2px; height: 2px; opacity: .01; pointer-events: none; }
  /* sombra no "chão", como um boneco apoiado */
  .figure::after {
    content: ""; position: absolute; left: 50%; bottom: calc((var(--gap, .03) - .03) * 100% - 1.5%); width: 78%; height: 5%; transform: translateX(-50%); z-index: -1;
    background: radial-gradient(closest-side, rgba(15, 79, 46, .32), rgba(15, 79, 46, 0));
  }
  /* entrada: a personagem surge com mola, o brilho se espalha */
  @keyframes fig-in { from { opacity: 0; transform: translate(-50%, -44%) scale(.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes glow-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.55); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .glow { animation: glow-in 1.6s var(--ease) both; }

  .corner { position: fixed; width: 22px; height: 22px; border: 2px solid var(--green); z-index: 5; pointer-events: none; opacity: .8; }
  .corner.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 16px; left: 16px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; }

  @media (max-width: 520px) {
    .corner.bl, .corner.br { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; }
    .figure, .figure.is-on { transition: none; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<script>
/* Personagens sem fundo, um de cada vez, mulheres e homens intercalados; o casal de corredores
   vem antes do José com a chave, que fecha a sequência. Depois recomeça (loop).
   Cada vídeo traz a cor na metade de cima e o recorte (alfa) na de baixo; o WebGL junta os dois.
   Sem WebGL ou sem autoplay, aparecem as imagens paradas (pôsteres) se alternando.
   Com "reduzir movimento", fica só a moça, parada. */
(() => {
  const figs = [...document.querySelectorAll('.figure')];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { figs[0].classList.add('is-on'); return; }   // fica só a primeira, parada

  const vs = `attribute vec2 p; varying vec2 uv;
    void main(){ uv = vec2((p.x + 1.0) * .5, (1.0 - p.y) * .5); gl_Position = vec4(p, 0., 1.); }`;
  const fs = `precision mediump float; varying vec2 uv; uniform sampler2D t;
    void main(){
      vec3 c = texture2D(t, vec2(uv.x, uv.y * .5)).rgb;
      float a = texture2D(t, vec2(uv.x, .5 + uv.y * .5)).r;
      a = smoothstep(.08, .92, a);
      gl_FragColor = vec4(c * a, a);   // cor pré-multiplicada: fundo transparente também no iPhone/Android
    }`;

  function setup(fig) {
    const video = fig.querySelector('video'), canvas = fig.querySelector('canvas');
    const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
    const ch = { fig, video, ok: false, draw() {} };
    if (!gl) return ch;
    const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); return x; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return ch;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
    const size = () => {
      const r = fig.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(r.width * d)); canvas.height = Math.max(1, Math.round(r.height * d));
      gl.viewport(0, 0, canvas.width, canvas.height);
    };
    window.addEventListener('resize', size);
    ch.ok = true;
    ch.draw = () => {
      if (video.readyState >= 2) {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        if (!ch.drawn) { ch.drawn = true; fig.classList.add('playing'); }   // só tira o pôster quando há quadro de verdade
      }
    };
    ch.size = size;
    const loop = () => {
      if (!video.paused) ch.draw();
      if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(loop); else requestAnimationFrame(loop);
    };
    video.addEventListener('playing', size, { once: true });
    loop();
    return ch;
  }

  const chars = figs.map(setup);
  // carrega o vídeo do próximo personagem enquanto o atual se apresenta
  const warm = c => {
    if (!c) return;
    const img = c.fig.querySelector('img[data-src]');
    if (img) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
    if (c.video.readyState === 0 && c.video.preload !== 'auto') { c.video.preload = 'auto'; c.video.load(); }
  };
  const PLAY_TIMES = 1;          // cada personagem dança uma vez e passa a vez para o outro
  const POSTER_MS = 4000;        // sem vídeo: tempo de cada pôster
  let cur = -1, timer;

  function show(i) {
    clearTimeout(timer);
    cur = i;
    chars.forEach((c, k) => {
      const on = k === i;
      c.fig.classList.toggle('is-on', on);
      if (!on) { c.video.pause(); }
    });
    const c = chars[i];
    warm(c); warm(chars[(i + 1) % chars.length]);
    let plays = 0;
    const next = () => show((i + 1) % chars.length);
    if (!c.ok) { timer = setTimeout(next, POSTER_MS); return; }
    c.video.currentTime = 0;
    // rede de segurança: se o "ended" não chegar (aba em segundo plano, vídeo travado), troca mesmo assim
    const guard = () => { clearTimeout(timer); timer = setTimeout(next, ((c.video.duration || 4) + 1.5) * 1000); };
    c.video.onended = () => {
      plays += 1;
      if (plays < PLAY_TIMES) { c.video.currentTime = 0; c.video.play().catch(() => {}); guard(); }
      else next();
    };
    guard();
    c.video.play().then(() => { c.size && c.size(); c.draw(); })
      .catch(() => { timer = setTimeout(next, POSTER_MS); });   // autoplay bloqueado: segue com os pôsteres
  }

  document.addEventListener('visibilitychange', () => {
    const c = chars[cur]; if (!c) return;
    if (document.hidden) c.video.pause(); else if (c.ok) c.video.play().catch(() => {});
  });
  setTimeout(() => show(0), 150);
})();
</script>
